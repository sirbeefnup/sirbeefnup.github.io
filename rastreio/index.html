<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sir Beef — Rastreando Pedido em Tempo Real...</title>
<style>body{background:#09090b;color:#f3d87d;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}</style>
</head>
<body>
<div><h2>🛵 Conectando ao Mapa ao Vivo Sir Beef...</h2><p style="color:#9ca3af;font-size:14px">Aguarde um instante...</p></div>
<script>
(async function(){
  const qs = window.location.search || "";
  try {
    const r = await fetch("/tunnel.json?t=" + Date.now(), {cache: "no-store"});
    const d = await r.json();
    if (d && d.tunnel_url) {
      window.location.replace(d.tunnel_url.replace(/\/$/, "") + "/rastreio" + qs);
      return;
    }
    if (d && d.lan_url) {
      window.location.replace(d.lan_url.replace(/\/$/, "") + "/rastreio" + qs);
      return;
    }
  } catch (e) {}
  window.location.replace("http://192.168.18.53:8080/rastreio" + qs);
})();
</script>
</body>
</html>
